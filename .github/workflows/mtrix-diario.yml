name: Mtrix diário
on:
  workflow_dispatch:          # botão de execução manual (para testar)
    inputs:
      data_inicio:
        description: 'Data início (YYYY-MM-DD). Vazio = ontem.'
        required: false
      data_fim:
        description: 'Data fim (YYYY-MM-DD). Vazio = igual ao início.'
        required: false
      sftp:
        description: 'SFTP Mtrix: nao = só gera | testar = só conecta e lista a pasta | enviar = gera e envia de verdade'
        required: true
        default: 'nao'
        type: choice
        options:
          - nao
          - testar
          - enviar
  schedule:
    - cron: '0 11 * * *'      # todo dia 08:00 (horário de Brasília = 11:00 UTC)
# Uma execução por vez: o Conta Azul troca o refresh token a cada uso, duas execuções juntas derrubariam uma a outra
concurrency:
  group: mtrix-diario
  cancel-in-progress: false
jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ---------- Teste de conexão SFTP (não gera nem envia arquivos) ----------
      - name: Instalar lftp
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sftp != 'nao' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Testar conexão SFTP (somente lista a pasta)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.sftp == 'testar' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "Faltam secrets: SFTP_HOST, SFTP_USER e SFTP_PASS são obrigatórios."
            exit 1
          fi
          DIR="${SFTP_DIR:-.}"
          PORT="${SFTP_PORT:-22}"
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST:$PORT" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -oHostKeyAlgorithms=+ssh-rsa"
          set net:max-retries 2
          set net:timeout 30
          cd "$DIR"
          pwd
          cls -l
          bye
          EOF
          echo "Conexão SFTP OK."

      # ---------- Geração dos arquivos ----------
      - name: Gerar arquivos Mtrix (somente Softys)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sftp != 'testar' }}
        env:
          CA_CLIENT_ID: ${{ secrets.CA_CLIENT_ID }}
          CA_CLIENT_SECRET: ${{ secrets.CA_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DATA_INICIO: ${{ github.event.inputs.data_inicio }}
          DATA_FIM: ${{ github.event.inputs.data_fim }}
          MTX_PERMITIDOS: ${{ vars.MTX_PERMITIDOS }}
          MTX_BLOQUEIO: ${{ vars.MTX_BLOQUEIO }}
        run: node gerar_mtrix.js
      - name: Conferir arquivos gerados
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sftp != 'testar' }}
        run: ls -la saida/
      # Disponibiliza os arquivos para download na propria pagina da execucao
      - name: Disponibilizar arquivos para download
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sftp != 'testar' }}
        uses: actions/upload-artifact@v4
        with:
          name: arquivos-mtrix
          path: saida/*.txt
      # Assunto do e-mail diário: começa com ATENCAO quando o resumo traz algum aviso
      - name: Preparar assunto do e-mail
        id: resumo
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sftp != 'testar' }}
        run: |
          if [ -f resumo/resumo.txt ] && grep -q '^ATENCAO' resumo/resumo.txt; then
            echo "assunto=ATENCAO Arquivos Mtrix ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "assunto=Arquivos Mtrix ${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      # Cópia por e-mail (registro/backup) com o resumo no corpo. Não derruba a execução se falhar.
      - name: Enviar por e-mail
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sftp != 'testar' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Holdex <${{ secrets.SMTP_USER }}>
          to: gabriel@holdex.com.br
          subject: ${{ steps.resumo.outputs.assunto }}
          body: file://resumo/resumo.txt
          attachments: saida/*.txt

      # ---------- Envio para a Mtrix via SFTP ----------
      # Roda sempre no agendamento diário. Em execução manual, só envia se sftp = enviar
      # (assim um teste com período diferente de "ontem" nunca vai parar na Mtrix por engano).
      - name: Enviar para a Mtrix via SFTP
        if: ${{ github.event_name == 'schedule' || github.event.inputs.sftp == 'enviar' }}
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SFTP_PASS }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
        run: |
          if [ -z "$SFTP_HOST" ] || [ -z "$SFTP_USER" ] || [ -z "$LFTP_PASSWORD" ]; then
            echo "Faltam secrets: SFTP_HOST, SFTP_USER e SFTP_PASS são obrigatórios."
            exit 1
          fi
          DIR="${SFTP_DIR:-.}"
          PORT="${SFTP_PORT:-22}"
          lftp --env-password -u "$SFTP_USER" "sftp://$SFTP_HOST:$PORT" <<EOF
          set cmd:fail-exit yes
          set sftp:auto-confirm yes
          set sftp:connect-program "ssh -a -x -oHostKeyAlgorithms=+ssh-rsa"
          set net:max-retries 3
          set net:timeout 30
          cd "$DIR"
          mput saida/*.txt
          cls -l
          bye
          EOF
          echo "Envio SFTP concluído."

      # ---------- Aviso de erro ----------
      # Se qualquer passo acima falhar, avisa por e-mail com o link da execução.
      - name: Avisar por e-mail em caso de erro
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Holdex <${{ secrets.SMTP_USER }}>
          to: gabriel@holdex.com.br
          subject: "ERRO Mtrix diario ${{ github.run_number }}"
          body: |
            A execucao do Mtrix diario falhou.
            Veja o detalhe em: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Se for erro no envio por SFTP, os arquivos do dia ficam no artefato arquivos-mtrix, na pagina da execucao.
